name: Build and Update llms.txt

on:
  push:
    branches:
      - master # Using master as seen in README.md links
    paths:
      - '**/*.md'
      - '**/*.proto'
      - 'scripts/build-llms-txt.ts'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate llms.txt
        run: bun run scripts/build-llms-txt.ts

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add llms.txt llms-full.txt
          if git diff --staged --quiet; then
            echo "No changes to llms.txt or llms-full.txt"
          else
            git commit -m "docs: update llms files [skip ci]"
            git push
          fi

